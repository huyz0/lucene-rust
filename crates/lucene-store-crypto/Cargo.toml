[package]
name = "lucene-store-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application-level encryption for lucene-store directories: an encrypting Directory wrapper with pluggable (BYOK) key providers."

[lints]
workspace = true

[dependencies]
lucene-store = { path = "../lucene-store" }
zeroize = "1"
# AES-256-GCM and the DRBG come from AWS-LC through aws-lc-rs (ISC AND
# Apache-2.0 AND OpenSSL): hand-tuned AES-NI/VAES/AVX-512 and ARMv8 code.
# Default `aws-lc`: the regular build (needs a C compiler). `fips`: the FIPS
# 140-3 validated module (needs CMake, Go and a C compiler as well); build it
# with `--no-default-features --features fips` (scripts/build-fips.sh).
aws-lc-rs = { version = "1", default-features = false, optional = true }
# Large files are decrypted chunk-parallel on open.
rayon.workspace = true

[features]
default = ["aws-lc"]
aws-lc = ["dep:aws-lc-rs", "aws-lc-rs/aws-lc-sys"]
fips = ["dep:aws-lc-rs", "aws-lc-rs/fips"]

[dev-dependencies]
lucene-util = { path = "../lucene-util", features = ["test-support"] }
lucene-index = { path = "../lucene-index" }
lucene-search = { path = "../lucene-search" }
lucene-codecs = { path = "../lucene-codecs" }
criterion.workspace = true

[[bench]]
name = "encryption"
harness = false
