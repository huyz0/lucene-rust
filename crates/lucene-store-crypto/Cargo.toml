[package]
name = "lucene-store-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Application-level encryption for lucene-store directories: an encrypting Directory wrapper with pluggable (BYOK) key providers."

[lints]
workspace = true

[dependencies]
lucene-store = { path = "../lucene-store" }
# AES-256-GCM (RustCrypto, Apache-2.0 OR MIT), hardware-accelerated where the
# CPU has AES-NI/PMULL. `getrandom` draws the per-file data keys and nonces.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
getrandom = "0.4"
zeroize = "1"

[dev-dependencies]
lucene-util = { path = "../lucene-util", features = ["test-support"] }
lucene-index = { path = "../lucene-index" }
lucene-search = { path = "../lucene-search" }
lucene-codecs = { path = "../lucene-codecs" }
