[package]
name = "lucene-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
lucene-util = { path = "../lucene-util" }
lucene-store = { path = "../lucene-store" }
lz4_flex.workspace = true
miniz_oxide.workspace = true

[features]
# Exposes a block-decode counter to the benchmark runner -- see
# `postings::test_only_block_decode_counter`. Same rationale and gating as
# `lucene-search`'s own test-support feature.
test-support = []

[dev-dependencies]
crc32fast.workspace = true
criterion.workspace = true

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "for_util_decode"
harness = false
