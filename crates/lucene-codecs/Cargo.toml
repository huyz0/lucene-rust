[package]
name = "lucene-codecs"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
lucene-util = { path = "../lucene-util" }
lucene-store = { path = "../lucene-store" }
lz4_flex.workspace = true
# OpenSearch custom-codecs' `zstd` and `zstd_no_dict` stored fields.
lucene-zstd = { path = "../lucene-zstd", features = ["dict-builder"] }
# The SimpleText codec's `checksum` line (`SimpleTextUtil.writeChecksum`).
crc32fast.workspace = true

[features]
# Exposes a block-decode counter to the benchmark runner -- see
# `postings::test_only_block_decode_counter`. Same rationale and gating as
# `lucene-search`'s own test-support feature.
test-support = []

[dev-dependencies]
# The shared RAII scratch-directory guard (`lucene_util::test_support::TempDir`).
# A `[dev-dependencies]` edge, so resolver-2 feature unification keeps the
# module out of this crate's production build.
lucene-util = { path = "../lucene-util", features = ["test-support"] }
criterion.workspace = true
# Independent DEFLATE streams for the inflater's tests.
miniz_oxide.workspace = true

[[bench]]
name = "hot_paths"
harness = false

[[bench]]
name = "for_util_decode"
harness = false

[[bench]]
name = "lz4_codec"
harness = false

[[bench]]
name = "regexp_intersect"
harness = false

[[bench]]
name = "blocktree_open"
harness = false

[[bench]]
name = "compiled_intersect"
harness = false
