[package]
name = "lucene-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
lucene-util = { path = "../lucene-util" }
memmap2.workspace = true
crc32fast.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# `crashing_directory::CrashingDirectory`, the crash half of Lucene's
# test-framework `MockDirectoryWrapper`, and the fault seams lucene-test-
# framework's `MockDirectoryWrapper` hooks (`OutputFaults`, `FsFaults`,
# `Input::Tracked`). Test infrastructure, like Java's: enabled through
# `[dev-dependencies]` edges and by lucene-test-framework, itself only ever a
# dev-dependency, so no production build (`-p lucene-ffi`) carries it. A
# whole-workspace build does, so the gate lints lucene-store alone too.
test-util = []

[dev-dependencies]
# The shared RAII scratch-directory guard (`lucene_util::test_support::TempDir`).
# A `[dev-dependencies]` edge, so resolver-2 feature unification keeps the
# module out of this crate's production build.
lucene-util = { path = "../lucene-util", features = ["test-support"] }
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "varint_decode"
harness = false
