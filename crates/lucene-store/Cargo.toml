[package]
name = "lucene-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
lucene-util = { path = "../lucene-util" }
memmap2.workspace = true
crc32fast.workspace = true

[dev-dependencies]
# The shared RAII scratch-directory guard (`lucene_util::test_support::TempDir`).
# A `[dev-dependencies]` edge, so resolver-2 feature unification keeps the
# module out of this crate's production build.
lucene-util = { path = "../lucene-util", features = ["test-support"] }
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "varint_decode"
harness = false
