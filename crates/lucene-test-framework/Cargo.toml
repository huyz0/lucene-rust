[package]
name = "lucene-test-framework"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Lucene's `lucene/test-framework` (M14.h): randomized-test infrastructure and
# the reusable `Base*TestCase` suites, as library code so the port inventory
# can point at it. A leaf that is only ever a `[dev-dependencies]` edge --
# no crate names it under `[dependencies]`, so it never reaches a production
# build (`cargo tree -p lucene-ffi` does not show it; check-port-invariants.py's
# `test-framework-dev-only` rule enforces it). Per package: a whole-workspace
# build unifies the `test-support` feature below into its lucene-util, the
# `asserting` feature into its lucene-search, and the `test-util` feature
# into its lucene-store (the fault seams the mock directory hooks), and
# `test-support` into lucene-codecs (stored-fields publication seams); a
# `-p lucene-ffi` build has none of them, as with the other crates'
# dev-dependencies. See the architecture skill and
# PLAN.md section 1.
#
# Not opted into the workspace's arithmetic gate (`[lints] workspace = true`):
# nothing here reads a length or count off disk; it generates random inputs
# and compares an implementation against a model.

[dependencies]
lucene-util = { path = "../lucene-util", features = ["test-support"] }
lucene-store = { path = "../lucene-store", features = ["test-util"] }
lucene-codecs = { path = "../lucene-codecs", features = ["test-support"] }
lucene-index = { path = "../lucene-index" }
# `asserting`: the scorer-tree seam the search checks (`search::query_utils`,
# `search::asserting`) drive -- lucene-search's `test_support` module.
lucene-search = { path = "../lucene-search", features = ["asserting"] }
# The mock analysis chain (`analysis`) implements lucene-analysis's traits.
lucene-analysis = { path = "../lucene-analysis" }
# Inflates the gzip members of Lucene's `europarl.lines.txt.gz` when
# `TESTS_LINEDOCSFILE` names it (`util::line_file_docs`).
miniz_oxide.workspace = true
# `BaseDirectoryTestCase.testChecksum`'s reference CRC32.
crc32fast.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
# `tests/check_random_data_all_analyzers.rs` runs `check_random_data` over
# every Analyzer in the workspace, the M12 modules' included.
lucene-analysis-icu = { path = "../lucene-analysis-icu" }
lucene-analysis-kuromoji = { path = "../lucene-analysis-kuromoji" }
lucene-analysis-morfologik = { path = "../lucene-analysis-morfologik" }
lucene-analysis-nori = { path = "../lucene-analysis-nori" }
lucene-analysis-smartcn = { path = "../lucene-analysis-smartcn" }
lucene-analysis-stempel = { path = "../lucene-analysis-stempel" }
