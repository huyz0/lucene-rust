[package]
name = "lucene-search"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
lucene-util = { path = "../lucene-util" }
lucene-store = { path = "../lucene-store" }
lucene-codecs = { path = "../lucene-codecs" }
lucene-index = { path = "../lucene-index" }
lucene-analysis = { path = "../lucene-analysis" }
rayon.workspace = true
# UAX #29 sentence segmentation, for the highlighter's `BreakIterator`
# equivalent -- see `highlighter::sentence_boundaries`.
unicode-segmentation.workspace = true

[features]
# Exposes this crate's `#[cfg(test)]`-only MAXSCORE block-skip counter
# (`test_only_maxscore_block_skip_counter`) to a *different* crate's own test
# suite -- namely `lucene-ffi`, which cannot see `lucene-search`'s
# `#[cfg(test)]` code no matter what it depends on, since that cfg is scoped
# to this crate's own `cargo test` build. Enabled only via `lucene-ffi`'s
# `[dev-dependencies]` edge (see that crate's `Cargo.toml`), which Cargo's
# resolver-2 feature unification confines to `lucene-ffi`'s test/bench
# targets -- never its normal library/cdylib build, so this never reaches a
# production binary.
test-support = []

[dev-dependencies]
# The shared RAII scratch-directory guard (`lucene_util::test_support::TempDir`).
# A `[dev-dependencies]` edge, so resolver-2 feature unification keeps the
# module out of this crate's production build.
lucene-util = { path = "../lucene-util", features = ["test-support"] }
criterion.workspace = true

# Settles b12 finding F-21 (`phrase_freq_exact`'s binary search vs
# `ExactPhraseMatcher`'s merge walk) with a measurement rather than an
# exponent -- see the bench's own module doc.
[[bench]]
name = "phrase_freq"
harness = false

# Settles c6 item 2 (`FieldNorms`'s eager sparse `Vec<i32>` vs a per-scorer
# `IndexedDISI` cursor) with a measurement -- see the bench's own module doc.
[[bench]]
name = "field_norms_sparse"
harness = false

# Settles b12 finding F-22 (`BooleanScorer`'s window/bucket bulk OR vs this
# port's per-document min-scan disjunction) -- see the bench's own module doc.
[[bench]]
name = "boolean_bulk_or"
harness = false

# Settles c11's claim that an `Occur.FILTER` clause is cheaper than the same
# clause as `Occur.MUST` -- see the bench's own module doc.
[[bench]]
name = "filter_vs_must"
harness = false

# Settles c1's F-13 (`directory_reader` -> `blocktree::open_shared`): how much
# of a segment open is the `.tim`/`.tip` copy -- see the bench's own module doc.
[[bench]]
name = "directory_reader_open"
harness = false

# Measures what c15's offsets-carrying postings API buys the unified
# highlighter, and the same change on the phrase paths -- see the bench's own
# module doc.
[[bench]]
name = "highlight_offsets"
harness = false

# Measures what `PostingsFlags::DocsOnly` buys the unscored paths (c8's
# `PForUtil.skip`, wired by c12) -- see the bench's own module doc.
[[bench]]
name = "docs_only_postings"
harness = false

# Measures the KNN fan-out's scaling and the two filtered paths' cost
# (c16-knn-query) -- see the bench's own module doc.
[[bench]]
name = "knn_multi_segment"
harness = false
