[package]
name = "lucene-search"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
lucene-util = { path = "../lucene-util" }
lucene-store = { path = "../lucene-store" }
lucene-codecs = { path = "../lucene-codecs" }
lucene-index = { path = "../lucene-index" }
lucene-ivf = { path = "../lucene-ivf" }
lucene-analysis = { path = "../lucene-analysis" }
rayon.workspace = true
# Inflates a Deeplearning4j word2vec model zip (`word2vec::read_dl4j_model`).
miniz_oxide.workspace = true

[features]
# Exposes this crate's `#[cfg(test)]`-only MAXSCORE block-skip counter
# (`test_only_maxscore_block_skip_counter`) to a *different* crate's own test
# suite -- namely `lucene-ffi`, which cannot see `lucene-search`'s
# `#[cfg(test)]` code no matter what it depends on, since that cfg is scoped
# to this crate's own `cargo test` build. Enabled only via `lucene-ffi`'s
# `[dev-dependencies]` edge (see that crate's `Cargo.toml`), which Cargo's
# resolver-2 feature unification confines to `lucene-ffi`'s test/bench
# targets -- never its normal library/cdylib build, so this never reaches a
# production binary.
test-support = []
# Compiles `test_support` (the scorer-tree seam and the asserting wrappers
# `lucene-test-framework`'s search checks drive) and the asserting hooks in
# the scorer builder and `score_segment`. Only `lucene-test-framework`
# enables it: the benchmark runner takes `test-support` for its counters but
# never this, so it measures the scoring code that ships
# (check-port-invariants.py's `bench-not-asserting` rule).
asserting = []

[dev-dependencies]
# The local_store example reads page-cache residency with mincore.
memmap2.workspace = true
libc.workspace = true
# The local_vectors example builds and reads an IVF index.
lucene-vector-quant = { path = "../lucene-vector-quant" }
# The modules split out of this crate, for the tests, benches and examples
# that still exercise them together with lucene-search (a dev-dependency
# cycle: these link the one lucene-search library).
lucene-queryparser = { path = "../lucene-queryparser" }
lucene-monitor = { path = "../lucene-monitor" }
lucene-highlighter = { path = "../lucene-highlighter" }
lucene-suggest = { path = "../lucene-suggest" }
lucene-grouping = { path = "../lucene-grouping" }
lucene-expressions = { path = "../lucene-expressions" }
lucene-facet = { path = "../lucene-facet" }
lucene-sandbox = { path = "../lucene-sandbox" }
# The shared RAII scratch-directory guard (`lucene_util::test_support::TempDir`).
# A `[dev-dependencies]` edge, so resolver-2 feature unification keeps the
# module out of this crate's production build.
lucene-util = { path = "../lucene-util", features = ["test-support"] }
# `CrashingDirectory`, for `examples/crash_fuzz.rs`.
lucene-store = { path = "../lucene-store", features = ["test-util"] }
criterion.workspace = true
# Re-signs a Rust-written file's footer after normalising its segment id, for
# the byte-for-byte fixture comparisons (`tests/merge_reorder_fixtures.rs`).
crc32fast.workspace = true

# Measures `phrase_freq_exact`'s binary search against `ExactPhraseMatcher`'s
# merge walk -- see the bench's own module doc.
[[bench]]
name = "conjunction_count"
harness = false

[[bench]]
name = "top_k_collect"
harness = false

[[bench]]
name = "phrase_freq"
harness = false

# Measures `FieldNorms`'s eager sparse `Vec<i32>` against a per-scorer
# `IndexedDISI` cursor -- see the bench's own module doc.
[[bench]]
name = "field_norms_sparse"
harness = false

# Measures `BooleanScorer`'s window/bucket bulk OR against this port's
# per-document min-scan disjunction -- see the bench's own module doc.
[[bench]]
name = "boolean_bulk_or"
harness = false

# Measures whether an `Occur.FILTER` clause is cheaper than the same
# clause as `Occur.MUST` -- see the bench's own module doc.
[[bench]]
name = "filter_vs_must"
harness = false

# Point range queries: the sorted-list, bit-set and dense inverse walks --
# see the bench's own module doc.
[[bench]]
name = "point_range"
harness = false

[[bench]]
name = "skipper"
harness = false

# A sloppy phrase as a filter: the first match against the full sloppy
# frequency -- see the bench's own module doc.
[[bench]]
name = "sloppy_phrase_filter"
harness = false

# `MUST_NOT` bulk scoring and the doc-values rewrite's ordinal set, the
# shapes Lucene 10.6's #16307, #16669 and #16297 change -- see the bench's
# own module doc.
[[bench]]
name = "req_excl"
harness = false

# How much of a segment open is the `.tim`/`.tip` copy -- see the bench's own module doc.
[[bench]]
name = "directory_reader_open"
harness = false

# Measures what the offsets-carrying postings API buys the unified
# highlighter, and the same change on the phrase paths -- see the bench's own
# module doc.
[[bench]]
name = "highlight_offsets"
harness = false

# Measures what `PostingsFlags::DocsOnly` buys the unscored paths
# (`PForUtil.skip`) -- see the bench's own module doc.
[[bench]]
name = "docs_only_postings"
harness = false

# Measures the KNN fan-out's scaling and the two filtered paths' cost
# (c16-knn-query) -- see the bench's own module doc.
[[bench]]
name = "knn_multi_segment"
harness = false

# Measures what `Weight.count`'s docFreq shortcut buys a counting caller
# (c37-search-behaviours) -- see the bench's own module doc.
[[bench]]
name = "term_count"
harness = false

# Measures a `STRING_VAL` sort's per-document cost (comparing and copying
# `BINARY` values) -- see the bench's own module doc.
[[bench]]
name = "string_val_sort"
harness = false

# The percolator hot paths (MemoryIndex, Monitor match/register) and the
# spell checker string distances -- see the bench module doc.
[[bench]]
name = "monitor_memory_spell"
harness = false

# Reader open/poll over a 30-segment index with deletes, plus the per-call
# `num_docs` and per-document `term_vectors` paths -- see the bench module doc.
[[bench]]
name = "reader_open"
harness = false

# The facets/grouping/join perf pass: FFI facet and range counting, sorted-set
# counting, `FacetsCollectorManager::search_sorted` -- see the bench's module doc.
[[bench]]
name = "facet_counting"
harness = false

# The facets/grouping/join perf pass: `GroupingSearch` and the query-time
# joins -- see the bench's module doc.
[[bench]]
name = "grouping_join"
harness = false

# The infix suggester's build/refresh/update/lookup and the expression
# layer's per-document evaluation -- see the bench's module doc.
[[bench]]
name = "suggest_expressions"
harness = false

# `DirectoryReader::open` of a compound, multi-format segment (the `.cfs`
# members and per-field dictionaries opened without copies) -- see the
# bench's own module doc.
[[bench]]
name = "segment_open_compound"
harness = false

# The geo point, shape, doc-values and Geo3D queries and the distance sort
# over one in-memory index -- see the bench's module doc.
[[bench]]
name = "geo_queries"
harness = false
