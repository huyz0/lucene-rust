[package]
name = "lucene-analysis-stempel"
version.workspace = true
edition.workspace = true
license.workspace = true

# lucene-analysis-stempel: the Egothor/Stempel stemmer tables,
# StempelFilter and PolishAnalyzer. Over lucene-analysis only, as Lucene's
# module is over lucene-analysis-common.
[features]
default = ["embedded-data"]
# Compiles the dictionary files in (src/resources); without it they are read
# from a data pack directory (lucene_analysis::data_pack).
embedded-data = []

[lints]
workspace = true

[dependencies]
lucene-analysis = { path = "../lucene-analysis" }
# Inflates the vendored stemmer table (src/resources/stemmer_20000.tbl.z).
miniz_oxide.workspace = true

[dev-dependencies]
# The shared factory-configuration harness (lucene-analysis/tests/support).
lucene-util = { path = "../lucene-util" }
