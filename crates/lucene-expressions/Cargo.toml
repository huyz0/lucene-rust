[package]
name = "lucene-expressions"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
lucene-util = { path = "../lucene-util" }
lucene-store = { path = "../lucene-store" }
lucene-codecs = { path = "../lucene-codecs" }
lucene-index = { path = "../lucene-index" }
lucene-search = { path = "../lucene-search" }
thiserror.workspace = true
cranelift-codegen = { version = "0.137", optional = true }
cranelift-frontend = { version = "0.137", optional = true }
cranelift-jit = { version = "0.137", optional = true }
cranelift-module = { version = "0.137", optional = true }
cranelift-native = { version = "0.137", optional = true }

[features]
# Native code for each expression, compiled with Cranelift. Off by default;
# an expression is compiled with it only when asked for (`Backend::Jit`).
jit = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native"]

[dev-dependencies]
lucene-util = { path = "../lucene-util", features = ["test-support"] }
