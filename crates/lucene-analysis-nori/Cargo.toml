[package]
name = "lucene-analysis-nori"
version.workspace = true
edition.workspace = true
license.workspace = true

# lucene-analysis-nori: Korean morphological analysis over
# mecab-ko-dic -- KoreanTokenizer (the Viterbi lattice of lucene-analysis'
# morph module, user dictionaries, decompounding), its filters,
# KoreanAnalyzer and the factories. Over lucene-analysis only, as Lucene's
# module is over lucene-analysis-common.
[features]
default = ["embedded-data"]
# Compiles the dictionary files in (src/resources); without it they are read
# from a data pack directory (lucene_analysis::data_pack).
embedded-data = []

[lints]
workspace = true

[dependencies]
lucene-analysis = { path = "../lucene-analysis" }
# Inflates the vendored dictionary (src/resources/*.z).
miniz_oxide.workspace = true

[dev-dependencies]
# The shared factory-configuration harness (lucene-analysis/tests/support).
lucene-util = { path = "../lucene-util" }
miniz_oxide.workspace = true
