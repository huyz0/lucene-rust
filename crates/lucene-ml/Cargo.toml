[package]
name = "lucene-ml"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
# Hugging Face tokenizers: the library ml-commons' DJL tokenizer wraps, so
# token ids are the same. No progress bars, no hub download, no C++ suffix
# arrays (only Unigram training uses them).
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }
# ONNX Runtime, loaded from the shared library the plugin ships (feature
# `load-dynamic`): ml-commons runs ONNX models on the same runtime.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["load-dynamic", "std"] }

# idf.json (sparse tokenize models); tokenizers already links it.
serde_json = "1"
# Java's `Double.toString`, for numbers ml-commons prints through Gson.
lucene-util = { path = "../lucene-util" }
# Remote connectors: SigV4 (HMAC-SHA256) and the credentials' AWS Encryption
# SDK messages (AES-GCM, HKDF-SHA512, ECDSA P-384). `aws-lc` is the regular
# build, `fips` the FIPS 140-3 module, as lucene-store-crypto builds it.
aws-lc-rs = { version = "1", default-features = false }

[features]
default = ["aws-lc"]
aws-lc = ["aws-lc-rs/aws-lc-sys"]
fips = ["aws-lc-rs/fips"]

[lints]
workspace = true
