# cargo-fuzz targets over lucene-ffi's C ABI. Outside the workspace:
# libFuzzer needs a nightly toolchain, and the workspace pins a stable one.
#
#   cd crates/lucene-ffi/fuzz && cargo +nightly fuzz run jvm_search -- -max_total_time=300
#
# See README.md for what each target drives and what counts as a finding.
[package]
name = "lucene-ffi-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
lucene-ffi = { path = ".." }
lucene-util = { path = "../../lucene-util" }
lucene-spatial3d = { path = "../../lucene-spatial3d" }
lucene-index = { path = "../../lucene-index" }
lucene-store = { path = "../../lucene-store" }
lucene-ml = { path = "../../lucene-ml" }
# This crate has no committed lockfile, so it resolves fresh each run, and
# zstd-sys 2.2 removed what the zstd-safe 7.4 it pairs with calls. Pinned to
# the workspace's version until zstd-safe is bumped.
zstd-sys = "=2.1.3"

[workspace]
members = ["."]

[[bin]]
name = "jvm_search"
path = "fuzz_targets/jvm_search.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jvm_open_reader"
path = "fuzz_targets/jvm_open_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jvm_live_docs"
path = "fuzz_targets/jvm_live_docs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "read_planet_object"
path = "fuzz_targets/read_planet_object.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jvm_search_sorted"
path = "fuzz_targets/jvm_search_sorted.rs"
test = false
doc = false
bench = false

[[bin]]
name = "check_corrupt_index"
path = "fuzz_targets/check_corrupt_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sigv4_sign"
path = "fuzz_targets/sigv4_sign.rs"
test = false
doc = false
bench = false

[[bin]]
name = "esdk_decrypt"
path = "fuzz_targets/esdk_decrypt.rs"
test = false
