[package]
name = "lucene-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# An indexing thread's scheduling priority (`yield_to_searches`).
libc.workspace = true
# Started before an indexing thread lowers its priority, which threads it
# starts would inherit (`yield_to_searches`).
rayon.workspace = true
lucene-store = { path = "../lucene-store" }
# What requests mean: the query blob decoders, analyzers from specs. The
# analysis modules compiled in follow this crate's features.
lucene-engine = { path = "../lucene-engine", default-features = false }
# The `encrypted` store (`store.rs`): AWS-LC by default, its FIPS 140-3
# module with feature `fips` (build with `--no-default-features`, see
# scripts/build-fips.sh).
lucene-store-crypto = { path = "../lucene-store-crypto", default-features = false }
zeroize = "1"
# The plugin library's allocator (feature `mimalloc`, which the plugin build
# turns on). Indexing runs on many JVM threads; glibc's malloc gives each its
# own arena and keeps freed memory in it, which left the node holding
# gigabytes after a bulk load. `local_dynamic_tls`: the JVM loads the library
# with dlopen, where initial-exec TLS has no room. `no_thp`: mimalloc would
# advise transparent huge pages for its arenas, and every buffer it reuses
# after purging then faults in, and zeroes, a whole 2 MiB page. Off by
# default so tests can install their own counting allocator.
mimalloc = { version = "0.1", default-features = false, features = ["local_dynamic_tls", "no_thp"], optional = true }
lucene-codecs = { path = "../lucene-codecs" }
lucene-zstd = { path = "../lucene-zstd" }
lucene-index = { path = "../lucene-index" }
lucene-search = { path = "../lucene-search" }
lucene-aggs = { path = "../lucene-aggs" }
# The unified highlighter the fetch phase runs (`jvm_highlight.rs`).
lucene-highlighter = { path = "../lucene-highlighter" }
lucene-sandbox = { path = "../lucene-sandbox" }
lucene-misc = { path = "../lucene-misc" }
lucene-sparse = { path = "../lucene-sparse" }
# The ml-commons port's local model inference (`ml.rs`).
lucene-ml = { path = "../lucene-ml", default-features = false }
# libtorch and the TorchScript shim (`ml_torch.rs`), opened at run time.
libloading = "0.8"
lucene-util = { path = "../lucene-util" }
lucene-analysis = { path = "../lucene-analysis" }

[features]
default = [
    "crypto",
    "analysis-icu",
    "analysis-kuromoji",
    "analysis-nori",
    "analysis-smartcn",
    "analysis-stempel",
    "analysis-morfologik",
    "analysis-phonetic",
]
# The encrypted store's crypto: AWS-LC (`crypto`, default) or AWS-LC's FIPS
# 140-3 module (`fips`, with `--no-default-features`). Exactly one.
crypto = ["lucene-store-crypto/aws-lc", "lucene-ml/aws-lc"]
fips = ["lucene-store-crypto/fips", "lucene-ml/fips"]
analysis-icu = ["lucene-engine/analysis-icu"]
mimalloc = ["dep:mimalloc"]
analysis-kuromoji = ["lucene-engine/analysis-kuromoji"]
analysis-nori = ["lucene-engine/analysis-nori"]
analysis-smartcn = ["lucene-engine/analysis-smartcn"]
analysis-stempel = ["lucene-engine/analysis-stempel"]
analysis-morfologik = ["lucene-engine/analysis-morfologik"]
analysis-phonetic = ["lucene-engine/analysis-phonetic"]
# `lang: "js"` scripts on V8 (lucene-engine's `painless_score/js.rs`): off by default, and the
# plugin builds it only with -Pjs.
js = ["lucene-engine/js"]
# Compiles the enabled modules' dictionaries in, so no pack directory is
# needed (a library about 22 MB larger).
embedded-data = ["lucene-engine/embedded-data"]

[build-dependencies]
# Compiles native/glibc_compat.c (build.rs); already in the tree through aws-lc-sys.
cc = "1"

[dev-dependencies]
# The shared RAII scratch-directory guard (`lucene_util::test_support::TempDir`).
# A `[dev-dependencies]` edge, so resolver-2 feature unification keeps the
# module out of this crate's production build.
lucene-util = { path = "../lucene-util", features = ["test-support"] }
lucene-engine = { path = "../lucene-engine", default-features = false, features = ["test-support"] }
# The tests that drive the entry points build the queries and scripts they run.
lucene-painless = { path = "../lucene-painless" }
lucene-pattern-text = { path = "../lucene-pattern-text" }
lucene-tensor = { path = "../lucene-tensor" }
lucene-facet = { path = "../lucene-facet" }
# fixtures/ml/expected.json, read by the TorchScript tests (`ml_torch.rs`).
serde_json = "1"

[lib]
crate-type = ["cdylib", "rlib"]
