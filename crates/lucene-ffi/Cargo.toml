[package]
name = "lucene-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
lucene-store = { path = "../lucene-store" }
# The `rust_encrypted` store (`store.rs`): AWS-LC by default, its FIPS 140-3
# module with feature `fips` (build with `--no-default-features`, see
# scripts/build-fips.sh).
lucene-store-crypto = { path = "../lucene-store-crypto", default-features = false }
zeroize = "1"
lucene-codecs = { path = "../lucene-codecs" }
lucene-index = { path = "../lucene-index" }
lucene-search = { path = "../lucene-search" }
lucene-util = { path = "../lucene-util" }
lucene-analysis = { path = "../lucene-analysis" }
# ICU's Thai dictionary word iterator, which `ThaiTokenizer` (the `thai`
# tokenizer and analyzer) segments with (lucene_analysis::lang::th), and
# with `analysis-icu` the module's own factories.
lucene-analysis-icu = { path = "../lucene-analysis-icu" }
# The Lucene analysis modules the plugin can build natively, each behind its
# feature (`analysis_modules.rs`). Their code is small; their dictionaries
# are data packs (`lucene_analysis::data_pack`) read from a pack directory
# at run time, unless `embedded-data` compiles them in.
lucene-analysis-kuromoji = { path = "../lucene-analysis-kuromoji", optional = true, default-features = false }
lucene-analysis-nori = { path = "../lucene-analysis-nori", optional = true, default-features = false }
lucene-analysis-smartcn = { path = "../lucene-analysis-smartcn", optional = true, default-features = false }
lucene-analysis-stempel = { path = "../lucene-analysis-stempel", optional = true, default-features = false }
lucene-analysis-morfologik = { path = "../lucene-analysis-morfologik", optional = true, default-features = false }
lucene-analysis-phonetic = { path = "../lucene-analysis-phonetic", optional = true }

[features]
default = [
    "crypto",
    "analysis-icu",
    "analysis-kuromoji",
    "analysis-nori",
    "analysis-smartcn",
    "analysis-stempel",
    "analysis-morfologik",
    "analysis-phonetic",
]
# The encrypted store's crypto: AWS-LC (`crypto`, default) or AWS-LC's FIPS
# 140-3 module (`fips`, with `--no-default-features`). Exactly one.
crypto = ["lucene-store-crypto/aws-lc"]
fips = ["lucene-store-crypto/fips"]
analysis-icu = []
analysis-kuromoji = ["dep:lucene-analysis-kuromoji"]
analysis-nori = ["dep:lucene-analysis-nori"]
analysis-smartcn = ["dep:lucene-analysis-smartcn"]
analysis-stempel = ["dep:lucene-analysis-stempel"]
analysis-morfologik = ["dep:lucene-analysis-morfologik"]
analysis-phonetic = ["dep:lucene-analysis-phonetic"]
# Compiles the enabled modules' dictionaries in, so no pack directory is
# needed (a library about 22 MB larger).
embedded-data = [
    "lucene-analysis-kuromoji?/embedded-data",
    "lucene-analysis-nori?/embedded-data",
    "lucene-analysis-smartcn?/embedded-data",
    "lucene-analysis-stempel?/embedded-data",
    "lucene-analysis-morfologik?/embedded-data",
]

[build-dependencies]
# Compiles native/glibc_compat.c (build.rs); already in the tree through aws-lc-sys.
cc = "1"

[dev-dependencies]
# The shared RAII scratch-directory guard (`lucene_util::test_support::TempDir`).
# A `[dev-dependencies]` edge, so resolver-2 feature unification keeps the
# module out of this crate's production build.
lucene-util = { path = "../lucene-util", features = ["test-support"] }

[lib]
crate-type = ["cdylib", "rlib"]
