[workspace]
resolver = "2"
# The benchmark runner is not part of the gate: it has no tests, so including
# it would drag the workspace coverage gate down for a measurement tool.
exclude = ["benchmarks/rust-runner", "crates/lucene-ffi/fuzz"]
members = [
    "crates/lucene-util",
    "crates/lucene-store",
    "crates/lucene-store-crypto",
    "crates/lucene-zstd",
    "crates/lucene-codecs",
    "crates/lucene-index",
    "crates/lucene-analysis",
    "crates/lucene-analysis-phonetic",
    "crates/lucene-analysis-stempel",
    "crates/lucene-analysis-morfologik",
    "crates/lucene-analysis-kuromoji",
    "crates/lucene-analysis-nori",
    "crates/lucene-analysis-smartcn",
    "crates/lucene-analysis-icu",
    "crates/lucene-analysis-opennlp",
    "crates/lucene-search",
    "crates/lucene-replicator",
    "crates/lucene-misc",
    "crates/lucene-sandbox",
    "crates/lucene-facet",
    "crates/lucene-sparse",
    "crates/lucene-vector-quant",
    "crates/lucene-ivf",
    "crates/lucene-disk-hnsw",
    "crates/lucene-expressions",
    "crates/lucene-grouping",
    "crates/lucene-classification",
    "crates/lucene-suggest",
    "crates/lucene-spatial-extras",
    "crates/lucene-queryparser",
    "crates/lucene-monitor",
    "crates/lucene-highlighter",
    "crates/lucene-ffi",
    "crates/lucene-tools",
    "crates/lucene-test-framework",
]
# A bare `cargo build`/`cargo test` at the root leaves the test framework out,
# so its `test-support`/`test-util` features are not unified into the
# production crates. `--workspace` (the gate) ignores this list and builds it
# anyway; the shipped artifact is the `-p lucene-ffi` build. Keep this list
# equal to `members` minus `crates/lucene-test-framework`.
default-members = [
    "crates/lucene-util",
    "crates/lucene-store",
    "crates/lucene-store-crypto",
    "crates/lucene-codecs",
    "crates/lucene-index",
    "crates/lucene-analysis",
    "crates/lucene-analysis-phonetic",
    "crates/lucene-analysis-stempel",
    "crates/lucene-analysis-morfologik",
    "crates/lucene-analysis-kuromoji",
    "crates/lucene-analysis-nori",
    "crates/lucene-analysis-smartcn",
    "crates/lucene-analysis-icu",
    "crates/lucene-analysis-opennlp",
    "crates/lucene-search",
    "crates/lucene-replicator",
    "crates/lucene-misc",
    "crates/lucene-sandbox",
    "crates/lucene-facet",
    "crates/lucene-sparse",
    "crates/lucene-vector-quant",
    "crates/lucene-ivf",
    "crates/lucene-disk-hnsw",
    "crates/lucene-expressions",
    "crates/lucene-grouping",
    "crates/lucene-classification",
    "crates/lucene-suggest",
    "crates/lucene-spatial-extras",
    "crates/lucene-queryparser",
    "crates/lucene-monitor",
    "crates/lucene-highlighter",
    "crates/lucene-ffi",
    "crates/lucene-tools",
]

# The build the OpenSearch plugin ships (`gradle -p opensearch-plugin
# bundlePlugin`). LTO lets calls inline across crates (lucene-search into
# lucene-codecs into lucene-store); the plain release profile measured 19%
# slower end to end. Thin rather than fat: fat LTO over all of lucene-ffi needs
# more than 15 GB to link. Tests keep the faster-building `release`.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/tuonghuy/lucene-rust"

[workspace.dependencies]
thiserror = "1"
memmap2 = "0.9"
crc32fast = "1"
# `fcntl` for `NativeFsLockFactory`'s OS record lock on `write.lock` -- the
# same lock Java's `FileChannel.tryLock` takes, so the two engines exclude each
# other. Already in the tree through memmap2 (docs/licences.md).
libc = "0.2"
lz4_flex = "0.11"
miniz_oxide = "0.9"
# Zstandard, through the C library zstd-jni wraps on the JVM: the `zstd` and
# `zstd_no_dict` stored fields of OpenSearch's custom-codecs plugin
# (`lucene-zstd`). `default-features = false` drops the legacy and
# multithreaded-compression parts nothing here uses.
zstd-safe = { version = "7", default-features = false, features = ["std"] }
unicode-segmentation = "1"
rayon = "1"
proptest = "1"
criterion = "0.5"

# The "arithmetic on a value read off disk" gate.
#
# A length, count, offset or width read out of an index file that reaches an
# `+`/`-`/`*`/`<<` without a bound is a *panic* in a debug build and a silent
# wrap in a release one. Through the FFI a panic is at best an error code and
# at worst a dead JVM, and the same value reaching `Vec::with_capacity` is an
# **abort**, which no `catch_unwind` can intercept. Hand audits keep missing
# this class, which is the argument for a mechanical gate.
#
# `clippy::arithmetic_side_effects` is that gate. It is opted into per crate
# (`[lints] workspace = true`) rather than switched on everywhere at once: a
# workspace-wide deny fires on 2 063 sites today, most of them `i + 1` in a
# loop, and a lint that has to be `#[allow]`-ed 2 000 times means nothing.
# See `docs/arithmetic-gate.md` for the adoption list, the burn-down, and the
# rule for writing an `#[allow]` that is allowed to stay.
[workspace.lints.clippy]
arithmetic_side_effects = "deny"
