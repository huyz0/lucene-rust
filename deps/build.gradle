// The one place third-party jars are downloaded. Every consumer (the data
// packs the Rust build needs, the fixture generators, the ML test libraries)
// asks this project for a named group of jars and reads them from the
// directory it fills, so a throttled Maven Central falls back to the mirror in
// one place, and every jar is checked against gradle/verification-metadata.xml.
//
//   ./gradlew -q fetch -Pgroups=data,icu -PoutDir=DIR
//   ./gradlew -q fetch -Pcoordinates=group:artifact:version[,...] -PoutDir=DIR
//
// Coordinates outside the groups below have no entry in the verification file
// and are refused.
//
// Gradle moves to the next repository only when one does not have the module
// (a 404); once it has chosen a repository, a throttled download (HTTP 429)
// fails the build instead of falling through. So the mirror, which does not
// throttle runner pools, comes first and Central second.

repositories {
    maven { url = uri('https://maven-central.storage-download.googleapis.com/maven2') }
    mavenCentral()
}

// Group name -> Maven coordinates. Versions are the pins the consumers named
// before this project existed; each group is the set one consumer needs.
