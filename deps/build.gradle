def wanted = (findProperty('groups') ?: '').split(',').collect { it.trim() }.findAll { it }
def outDir = findProperty('outDir')
def extra = (findProperty('coordinates') ?: '').split(',').collect { it.trim() }.findAll { it }

tasks.register('fetch') {
    doLast {
        if ((wanted.isEmpty() && extra.isEmpty()) || outDir == null) {
            throw new GradleException('usage: fetch -Pgroups=<name>[,<name>...] or -Pcoordinates=<g:a:v>[,...] -PoutDir=<dir>; groups: ' + groups.keySet().join(', '))
        }
        if (!extra.isEmpty()) {
            def cfg = configurations.detachedConfiguration(*extra.collect { dependencies.create(it + '@jar') })
            cfg.transitive = false
            copy {
                from cfg.resolve()
                into outDir
            }
        }
        wanted.each { name ->
            def coordinates = groups[name]
            if (coordinates == null) {
                throw new GradleException("unknown group '${name}'; groups: " + groups.keySet().join(', '))
            }
            def cfg = configurations.detachedConfiguration(
                    *coordinates.collect { dependencies.create(it + '@jar') })
            cfg.transitive = false
            copy {
                from cfg.resolve()
                into outDir
            }
        }
    }
}

// Every group at once, for `--write-verification-metadata`.
tasks.register('resolveAll') {
    doLast {
        groups.values().flatten().unique().each { coordinate ->
            configurations.detachedConfiguration(dependencies.create(coordinate + '@jar')).with {
                transitive = false
                resolve()
            }
        }
    }
}
