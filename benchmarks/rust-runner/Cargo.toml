[package]
name = "bench-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
lucene-store = { path = "../../crates/lucene-store" }
lucene-search = { path = "../../crates/lucene-search", features = ["test-support"] }
lucene-codecs = { path = "../../crates/lucene-codecs", features = ["test-support"] }
lucene-index = { path = "../../crates/lucene-index" }
lucene-ffi = { path = "../../crates/lucene-ffi" }

[[bin]]
name = "bench-runner"
path = "src/main.rs"

[[bin]]
name = "ffi-overhead"
path = "src/ffi_overhead.rs"

[[bin]]
name = "micro"
path = "src/micro.rs"

[profile.release]
debug = true          # keep frame pointers/symbols for profiling (T1.4)
# The JVM's JIT inlines across the whole program; without LTO the Rust build
# cannot inline across crate boundaries, which is most of this hot path
# (lucene-search -> lucene-codecs -> lucene-store).
lto = "fat"
codegen-units = 1
