[package]
name = "bench-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[dependencies]
# The allocator the plugin library ships with (lucene-ffi feature `mimalloc`),
# so allocation costs here are the ones the engine pays in production.
mimalloc = { version = "0.1.52", default-features = false, features = ["no_thp"] }
lucene-store = { path = "../../crates/lucene-store" }
lucene-search = { path = "../../crates/lucene-search", features = ["test-support"] }
lucene-replicator = { path = "../../crates/lucene-replicator" }
lucene-misc = { path = "../../crates/lucene-misc" }
lucene-sandbox = { path = "../../crates/lucene-sandbox" }
lucene-facet = { path = "../../crates/lucene-facet" }
lucene-expressions = { path = "../../crates/lucene-expressions" }
lucene-grouping = { path = "../../crates/lucene-grouping" }
lucene-classification = { path = "../../crates/lucene-classification" }
lucene-suggest = { path = "../../crates/lucene-suggest" }
lucene-spatial-extras = { path = "../../crates/lucene-spatial-extras" }
lucene-queryparser = { path = "../../crates/lucene-queryparser" }
lucene-monitor = { path = "../../crates/lucene-monitor" }
lucene-highlighter = { path = "../../crates/lucene-highlighter" }
lucene-codecs = { path = "../../crates/lucene-codecs", features = ["test-support"] }
lucene-index = { path = "../../crates/lucene-index" }
lucene-ffi = { path = "../../crates/lucene-ffi" }
lucene-util = { path = "../../crates/lucene-util" }
lucene-analysis = { path = "../../crates/lucene-analysis" }
lucene-analysis-phonetic = { path = "../../crates/lucene-analysis-phonetic" }
lucene-analysis-stempel = { path = "../../crates/lucene-analysis-stempel" }
lucene-analysis-morfologik = { path = "../../crates/lucene-analysis-morfologik" }
lucene-analysis-kuromoji = { path = "../../crates/lucene-analysis-kuromoji" }
lucene-analysis-nori = { path = "../../crates/lucene-analysis-nori" }
lucene-analysis-smartcn = { path = "../../crates/lucene-analysis-smartcn" }
lucene-analysis-icu = { path = "../../crates/lucene-analysis-icu" }
lucene-analysis-opennlp = { path = "../../crates/lucene-analysis-opennlp" }
crc32fast = "1"
miniz_oxide = "0.9"

[[bin]]
name = "bench-runner"
path = "src/main.rs"

[[bin]]
name = "alloc-profile"
path = "src/alloc_profile.rs"

[[bin]]
name = "index-bench"
path = "src/index_bench.rs"

[[bin]]
name = "merge-bench"
path = "src/merge_bench.rs"

[[bin]]
name = "micro"
path = "src/micro.rs"

[profile.release]
debug = true          # keep frame pointers/symbols for profiling (T1.4)
# The JVM's JIT inlines across the whole program; without LTO the Rust build
# cannot inline across crate boundaries, which is most of this hot path
# (lucene-search -> lucene-codecs -> lucene-store).
lto = "fat"
codegen-units = 1

[features]
# Times lucene-expressions' Cranelift backend (BENCH_EXPR_BACKEND=jit).
expr-jit = ["lucene-expressions/jit"]
