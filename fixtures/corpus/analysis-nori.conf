# Configurations for GenAnalysisNori.java and crates/lucene-analysis-nori/tests/nori_fixtures.rs,
# in analysis-factories.conf's syntax (name<TAB>step<TAB>key=value...); resources in analysis-factories/.
ko_tok_default	tok:korean
ko_tok_none	tok:korean	decompoundMode=none
ko_tok_mixed	tok:korean	decompoundMode=Mixed	discardPunctuation=false
ko_tok_unigrams	tok:korean	outputUnknownUnigrams=true
ko_tok_user	tok:korean	userDictionary=ko-userdict.txt	decompoundMode=mixed
ko_tok_user_utf8	tok:korean	userDictionary=ko-userdict.txt	userDictionaryEncoding=UTF-8
ko_tok_user_missing	tok:korean	userDictionary=missing.txt
ko_tok_user_bad	tok:korean	userDictionary=ko-userdict-bad.txt
ko_tok_user_empty	tok:korean	userDictionary=empty.txt
ko_tok_bad_mode	tok:korean	decompoundMode=all
ko_tok_bad_param	tok:korean	x=1
ko_posstop_default	tok:korean	tf:koreanPartOfSpeechStop
ko_posstop_tags	tok:korean	tf:koreanPartOfSpeechStop	tags=NNG, JKS,jko
ko_posstop_bad_tag	tok:korean	tf:koreanPartOfSpeechStop	tags=XYZ
ko_posstop_param	tok:korean	tf:koreanPartOfSpeechStop	x=1
ko_reading	tok:korean	tf:koreanReadingForm
ko_number	tok:korean	discardPunctuation=false	tf:koreanNumber
