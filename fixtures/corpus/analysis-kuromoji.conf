ja_katakana_stem_1	tok:japanese	tf:japaneseKatakanaStem	minimumLength=1
ja_hiragana_upper	tok:japanese	mode=extended	tf:japaneseHiraganaUppercase
ja_katakana_upper	tok:japanese	mode=extended	tf:japaneseKatakanaUppercase
ja_number	tok:japanese	mode=normal	discardPunctuation=false	tf:japaneseNumber
