ja_tok_extended_punct	tok:japanese	mode=EXTENDED	discardPunctuation=false	discardCompoundToken=false
ja_tok_user	tok:japanese	mode=search	userDictionary=ja-userdict.txt
ja_tok_user_utf8	tok:japanese	userDictionary=ja-userdict.txt	userDictionaryEncoding=UTF-8
ja_tok_user_missing	tok:japanese	userDictionary=missing.txt
ja_tok_user_bad	tok:japanese	userDictionary=ja-userdict-bad.txt
ja_tok_user_empty	tok:japanese	userDictionary=empty.txt
ja_tok_nbest	tok:japanese	mode=normal	nBestCost=2000
ja_tok_nbest_examples	tok:japanese	mode=normal	nBestExamples=関西国際空港-国際/東京特許許可局-許可
ja_tok_nbest_bad_examples	tok:japanese	nBestExamples=国際
ja_tok_bad_mode	tok:japanese	mode=fast
ja_tok_bad_param	tok:japanese	x=1
ja_tok_bad_nbest	tok:japanese	nBestCost=many
ja_baseform	tok:japanese	tf:japaneseBaseForm
ja_baseform_param	tok:japanese	tf:japaneseBaseForm	x=1
ja_posstop_default	tok:japanese	tf:japanesePartOfSpeechStop
ja_posstop_tags	tok:japanese	tf:japanesePartOfSpeechStop	tags=ja-stoptags.txt
ja_posstop_empty	tok:japanese	tf:japanesePartOfSpeechStop	tags=empty.txt
