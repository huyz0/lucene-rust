# Configurations for GenAnalysisKuromoji.java and crates/lucene-analysis-kuromoji/tests/kuromoji_fixtures.rs,
# in analysis-factories.conf's syntax (name<TAB>step<TAB>key=value...); resources in analysis-factories/.
ja_tok_default	tok:japanese
