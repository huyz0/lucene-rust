// The lucene-rust OpenSearch plugin.
//
// It compiles against the jars of the OpenSearch distribution it installs
// into -- `lib/` of the pinned `opensearchproject/opensearch` image, which
// `scripts/opensearch-dist.sh` extracts -- rather than against Maven
// artifacts. A plugin must match its node's exact version anyway, and this
// keeps the build offline and identical to what runs.
//
//   scripts/opensearch-dist.sh               # once: extract lib/ from the image
//   gradle -p opensearch-plugin bundlePlugin # the installable zip
//   gradle -p opensearch-plugin check        # the JVM-side self test

plugins {
    id 'java'
}

group = 'org.lucenerust'
version = '0.1.0'

def opensearchVersion = '3.9.0'
def repoRoot = projectDir.parentFile
def opensearchLib = file(findProperty('opensearchLib') ?: "${repoRoot}/target/opensearch-dist/${opensearchVersion}/lib")
def cargoTarget = file(System.getenv('CARGO_TARGET_DIR') ?: "${repoRoot}/target")
// -Pfips: the FIPS variant. The native library's encryption uses AWS-LC's FIPS
// 140-3 module (scripts/build-fips.sh --ffi, its own target directory), and the
// JVM side's uses the Amazon Corretto Crypto Provider's FIPS build (the same
// module), bundled in the zip; SunJCE is never used (store/StoreCrypto.java).
def fips = findProperty('fips') != null
def accpVersion = '2.5.0'
// The ONNX Runtime ml-commons' local models run on; lucene-ml needs its C API 17 or later.
def onnxRuntimeVersion = '1.23.2'
def fipsTarget = file(System.getenv('CARGO_TARGET_DIR') ?: "${repoRoot}/target/fips")
// -PcargoProfile: the Cargo profile the native library is built with. `dist`
// (whole-program LTO, the default) is what a plugin zip ships; CI's test jobs
// pass `release`, which builds several times faster.
def cargoProfile = findProperty('cargoProfile') ?: 'dist'
// -PnativeLib: an already built library to use instead (for example the
// profile-guided one scripts/pgo-build.sh writes); cargoBuild is then skipped.
def prebuiltNative = findProperty('nativeLib')
def nativeLib = prebuiltNative ? file(prebuiltNative)
        : file("${fips ? fipsTarget : cargoTarget}/${cargoProfile}/liblucene_ffi.so")

// Mirrors NativeLibrary.platform(): the directory the zip carries the
// library under.
def hostPlatform = {
    def arch = System.getProperty('os.arch').toLowerCase()
    arch = (arch in ['amd64', 'x86_64']) ? 'x86_64' : ((arch in ['aarch64', 'arm64']) ? 'aarch64' : arch)
    return "linux-${arch}"
}()

// JDK 25, the one OpenSearch 3.9.0 bundles: the native bridge is the Foreign
// Function & Memory API (final since JDK 22). A toolchain, so Gradle itself
// may run on an older JDK; every JavaExec and Test task launches on it.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

def jdk25 = javaToolchains.launcherFor(java.toolchain)
tasks.withType(JavaExec).configureEach { javaLauncher = jdk25 }
tasks.withType(Test).configureEach { javaLauncher = jdk25 }

// The scripts that run a staged classpath outside Gradle (the YAML runner, the
// engine tests) need this same JDK: the classes are release 25, and a bare
// `java` on PATH is often Gradle's older one (CI's JAVA_HOME is JDK 21), which
// refuses them with UnsupportedClassVersionError. They read the path here.
def javaLauncherFile = layout.buildDirectory.file('java-launcher.txt')
def writeJavaLauncher = tasks.register('writeJavaLauncher') {
    description = 'Writes the JDK 25 launcher path to build/java-launcher.txt.'
    def exe = jdk25.map { it.executablePath.asFile.absolutePath }
    def out = javaLauncherFile
    outputs.file(out)
    outputs.upToDateWhen { false }
    doLast { out.get().asFile.text = exe.get() + '\n' }
}

// Downcalls and `SymbolLookup.libraryLookup` are restricted methods; without
// this the JVM warns on first use (a later JDK refuses). The node needs the
// same line in its jvm.options (see README.md).
def nativeAccess = '--enable-native-access=ALL-UNNAMED'

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.compilerArgs += ['-Xlint:all,-processing,-serial', '-Werror']
    options.encoding = 'UTF-8'
}

configurations {
    fipsProvider
    onnxRuntime
}

dependencies {
    compileOnly fileTree(dir: opensearchLib, include: '*.jar')
    testImplementation fileTree(dir: opensearchLib, include: '*.jar')
    // Painless's SPI, which the k-NN allowlist (knn/script/KnnAllowlistExtension) implements.
    def painlessSpi = files("${opensearchLib}/../modules/lang-painless/opensearch-scripting-painless-spi-${opensearchVersion}.jar")
    compileOnly painlessSpi
    testImplementation painlessSpi
    // Painless itself (and the jars its front end needs), whose IR the native Painless runtime
    // runs (painless/PainlessIr): the plugin extends lang-painless, so the node provides them.
    def painless = fileTree(dir: "${opensearchLib}/../modules/lang-painless", include: ['lang-painless-*.jar', 'antlr4-runtime-*.jar', 'asm-*.jar'])
    compileOnly painless
    testImplementation painless
    // kuromoji and nori, which OpenSearch ships as plugins rather than in lib/, at the
    // distribution's Lucene version: the self test describes their analyzers.
    def luceneVersion = providers.provider {
        fileTree(dir: opensearchLib, include: 'lucene-core-*.jar').singleFile.name - 'lucene-core-' - '.jar'
    }
    for (m in ['kuromoji', 'nori']) {
        def module = m
        testImplementation luceneVersion.map { "org.apache.lucene:lucene-analysis-${module}:${it}" }
    }
    // The ONNX Runtime library ml-commons' local models run on, taken from Microsoft's jar.
    onnxRuntime "com.microsoft.onnxruntime:onnxruntime:${onnxRuntimeVersion}@jar"
    if (fips) {
        // ACCP's classifier names the platform: linux-x86_64 or linux-aarch_64.
        def accpPlatform = hostPlatform == 'linux-aarch64' ? 'linux-aarch_64' : hostPlatform
        fipsProvider "software.amazon.cryptools:AmazonCorrettoCryptoProvider-FIPS:${accpVersion}:${accpPlatform}"
        testRuntimeOnly "software.amazon.cryptools:AmazonCorrettoCryptoProvider-FIPS:${accpVersion}:${accpPlatform}"
    }
}

// lucene-rust-build.properties: which variant this jar is (StoreCrypto.buildIsFips).
def buildProperties = layout.buildDirectory.dir('generated/build-properties')
def writeBuildProperties = tasks.register('writeBuildProperties') {
    def out = buildProperties
    def isFips = fips
    inputs.property('fips', isFips)
    outputs.dir(out)
    doLast {
        def f = out.get().file('lucene-rust-build.properties').asFile
        f.parentFile.mkdirs()
        f.text = "fips=${isFips}\n"
    }
}
sourceSets.main.resources.srcDir(buildProperties)
tasks.named('processResources') { dependsOn writeBuildProperties }

def checkDist = tasks.register('checkOpensearchDist') {
    doLast {
        if (!file("${opensearchLib}/opensearch-${opensearchVersion}.jar").exists()) {
            throw new GradleException("No OpenSearch ${opensearchVersion} jars at ${opensearchLib}: run scripts/opensearch-dist.sh")
        }
    }
}
tasks.named('compileJava') { dependsOn checkDist }

def cargoBuild = tasks.register('cargoBuild', Exec) {
    description = 'Builds liblucene_ffi.so (-PcargoProfile, dist by default) for this host; with -Pfips, against the FIPS module.'
    workingDir repoRoot
    onlyIf { prebuiltNative == null }
    if (fips) {
        commandLine 'scripts/build-fips.sh', '--ffi', '--profile', cargoProfile
    } else {
        commandLine 'cargo', 'build', '--profile', cargoProfile, '-p', 'lucene-ffi', '--features', 'mimalloc'
    }
}

// The analysis modules' data packs (their dictionaries), for the self test
// and for a zip built with -PdataPacks.
def dataPacks = file("${cargoTarget}/data-packs")
def makeDataPacks = tasks.register('makeDataPacks', Exec) {
    description = 'Writes the analysis modules\' data packs (scripts/make-data-packs.sh).'
    workingDir repoRoot
    commandLine 'scripts/make-data-packs.sh', dataPacks.absolutePath
}

// native/<platform>/libonnxruntime.so for this host, out of the ONNX Runtime jar, with
// ONNX Runtime's licence and third-party notices.
def onnxRuntimeLib = tasks.register('onnxRuntimeLib', Sync) {
    description = 'Extracts this host\'s libonnxruntime.so and its notices from the ONNX Runtime jar.'
    def ortPlatform = hostPlatform == 'linux-x86_64' ? 'linux-x64' : hostPlatform
    def platformDir = "native/${hostPlatform}"
    from({ zipTree(configurations.onnxRuntime.singleFile) }) {
        include "ai/onnxruntime/native/${ortPlatform}/libonnxruntime.so", 'ThirdPartyNotices.txt'
        eachFile { path = name == 'ThirdPartyNotices.txt' ? 'onnxruntime-ThirdPartyNotices.txt' : "${platformDir}/${name}" }
        includeEmptyDirs = false
    }
    from(file("licenses/onnxruntime-LICENSE"))
    into layout.buildDirectory.dir('onnxruntime')
}

// native/<platform>/liblucene_torch_{cxx11,precxx11}.so: the shim TorchScript models run through
// on libtorch, which a node finds or downloads at first use as stock ml-commons does.
def torchShimDir = file("${cargoTarget}/torch-shim")
def torchShim = tasks.register('torchShim', Exec) {
    description = 'Builds the TorchScript shim for this host, once per libtorch C++ ABI (scripts/build-torch-shim.sh).'
    workingDir repoRoot
    inputs.file("${repoRoot}/crates/lucene-ffi/torch/lucene_torch.cpp")
    inputs.file("${repoRoot}/scripts/build-torch-shim.sh")
    outputs.files(file("${torchShimDir}/liblucene_torch_cxx11.so"), file("${torchShimDir}/liblucene_torch_precxx11.so"))
    commandLine 'scripts/build-torch-shim.sh', torchShimDir.absolutePath
}

tasks.register('bundlePlugin', Zip) {
    description = 'The installable plugin zip: jar, descriptor, and native/<platform>/liblucene_ffi.so.'
    dependsOn tasks.named('jar'), cargoBuild
    archiveFileName = fips ? "lucene-rust-fips-${version}.zip" : "lucene-rust-${version}.zip"
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(tasks.named('jar'))
    from('src/plugin-metadata') {
        expand(version: version, opensearchVersion: opensearchVersion)
    }
    from(nativeLib) { into "native/${hostPlatform}" }
    from(torchShim) { into "native/${hostPlatform}" }
    from(onnxRuntimeLib)
    // The FIPS variant's JCE provider, on the plugin's class path.
    from(configurations.fipsProvider)
    // The licence and notices ship with the binary they cover.
    from(file("${repoRoot}/LICENSE"))
    from(file("${repoRoot}/NOTICE"))
    // -PdataPacks: the analysis modules' data packs ship in the zip
    // (packs/<pack>/...), about 21 MB; without it a node adds them under
    // <config>/lucene-rust/packs/.
    if (findProperty('dataPacks')) {
        dependsOn makeDataPacks
        from(dataPacks) { into 'packs' }
    }
    // A library built elsewhere for another platform, e.g.
    // -PextraNative=linux-aarch64=/path/to/liblucene_ffi.so
    if (findProperty('extraNative')) {
        findProperty('extraNative').split(',').each { spec ->
            def (plat, path) = spec.split('=', 2)
            from(file(path)) { into "native/${plat}" }
        }
    }
}

// The self test is a plain `main` (NativeSelfTest) rather than a JUnit suite,
// so that it needs no artifact beyond the distribution's jars and the kuromoji
// and nori modules.
def selfTest = tasks.register('selfTest', JavaExec) {
    description = 'Differential self test: the native path against Lucene IndexSearcher.'
    dependsOn tasks.named('testClasses'), cargoBuild, makeDataPacks
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lucenerust.opensearch.NativeSelfTest'
    systemProperty 'lucene_rust.library.path', nativeLib.absolutePath
    systemProperty 'lucene_rust.data_packs', dataPacks.absolutePath
    // Rust's float kernels always fuse multiply-adds; Lucene's scalar kernels do
    // only where Constants.HAS_FAST_SCALAR_FMA picks it for the CPU, so scores
    // would differ in the last ulp on some runners.
    systemProperty 'lucene.useScalarFMA', 'true'
    jvmArgs nativeAccess, '-ea'
    args "${repoRoot}/fixtures/data"
}
// The Rust engine's writer against Lucene's IndexWriter, document by document.
def engineWriterTest = tasks.register('engineWriterTest', JavaExec) {
    description = 'Differential test: RustIndexWriter against Lucene IndexWriter on the same operations.'
    dependsOn tasks.named('testClasses'), cargoBuild
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lucenerust.opensearch.engine.EngineWriterDiffTest'
    systemProperty 'lucene_rust.library.path', nativeLib.absolutePath
    jvmArgs nativeAccess, '-ea'
}
// The encrypted store: Lucene and the Rust engine reading and writing one encrypted index.
def encryptedStoreTest = tasks.register('encryptedStoreTest', JavaExec) {
    description = 'The encrypted store end to end: Java writes / Rust reads, Rust writes / Java reads.'
    dependsOn tasks.named('testClasses'), cargoBuild
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lucenerust.opensearch.engine.EncryptedStoreTest'
    systemProperty 'lucene_rust.library.path', nativeLib.absolutePath
    jvmArgs nativeAccess, '-ea'
}
tasks.named('test') { enabled = false }
tasks.named('check') { dependsOn selfTest, engineWriterTest, encryptedStoreTest }

// With the JVM in the loop: the native call's crossing cost and
// in-process query latency, native vs Lucene. Not part of `check` -- it is a
// measurement.
tasks.register('nativeBench', JavaExec) {
    description = 'Native call crossing cost and per-query latency, native vs Lucene, in one JVM.'
    dependsOn tasks.named('testClasses'), cargoBuild
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lucenerust.opensearch.NativeBench'
    systemProperty 'lucene_rust.library.path', nativeLib.absolutePath
    jvmArgs nativeAccess, '-Xms2g', '-Xmx2g', '--add-modules', 'jdk.incubator.vector'
    args findProperty('docs') ?: '500000'
}

// The indexing path stage by stage (encode, native prepare, RustIndexWriter) against Lucene's
// IndexWriter on OpenSearch-shaped documents. A measurement, not part of `check`.
tasks.register('indexingBench', JavaExec) {
    description = 'Indexing throughput by stage: DocumentEncoder, native prepare, RustIndexWriter, Lucene.'
    dependsOn tasks.named('testClasses'), cargoBuild
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.lucenerust.opensearch.engine.IndexingBench'
    systemProperty 'lucene_rust.library.path', nativeLib.absolutePath
    jvmArgs nativeAccess, '-Xms4g', '-Xmx4g'
    systemProperty 'refresh.ms', findProperty('refreshMs') ?: '1000'
    systemProperty 'merge_on_flush.ms', findProperty('mergeOnFlushMs') ?: '10000'
    systemProperty 'force_merge', findProperty('forceMerge') ?: 'false'
    args findProperty('docs') ?: '200000', findProperty('threads') ?: '4', findProperty('modes') ?: 'encode,prepare,rust,lucene', findProperty('rounds') ?: '2'
}

// OpenSearch's own REST YAML suites against a running node with the plugin
// installed (scripts/verify-opensearch.sh --yaml). The only part of the build
// that needs Maven Central: the YAML runner is OpenSearch's test framework.
repositories {
    mavenCentral()
}
sourceSets {
    yamlRestTest {
        java.srcDir 'src/yamlRestTest/java'
    }
}
configurations {
    yamlRestTestImplementation
    restSpec
}
dependencies {
    yamlRestTestImplementation "org.opensearch.test:framework:${opensearchVersion}"
    restSpec "org.opensearch:rest-api-spec:${opensearchVersion}"
}
// The YAML loader walks rest-api-spec/ as a directory (a path inside a jar
// is not one), so the spec jar is unpacked onto the runner's classpath -- as
// OpenSearch's own build does.
def extractRestSpec = tasks.register('extractRestSpec', Sync) {
    from { zipTree(configurations.restSpec.singleFile) }
    include 'rest-api-spec/**'
    into layout.buildDirectory.dir('rest-spec')
}
sourceSets.yamlRestTest.runtimeClasspath += files(layout.buildDirectory.dir('rest-spec')) { builtBy extractRestSpec }
tasks.named('compileYamlRestTestJava') {
    options.compilerArgs -= ['-Werror']
}
tasks.register('yamlRestTest', Test) {
    description = 'OpenSearch REST YAML suites against -Ptests.rest.cluster (default localhost:9200).'
    testClassesDirs = sourceSets.yamlRestTest.output.classesDirs
    classpath = sourceSets.yamlRestTest.runtimeClasspath
    useJUnit()
    systemProperty 'tests.rest.cluster', findProperty('tests.rest.cluster') ?: 'localhost:9200'
    systemProperty 'tests.rest.suite', findProperty('tests.rest.suite') ?: 'search'
    systemProperty 'tests.cluster', findProperty('tests.rest.cluster') ?: 'localhost:9200'
    systemProperty 'tests.clustername', 'docker-cluster'
    systemProperty 'lucene_rust.preserve_templates', findProperty('preserveTemplates') ?: 'false'
    systemProperty 'tests.security.manager', 'false'
    // Run everything and report, rather than stopping at the first failure.
    ignoreFailures = findProperty('yamlIgnoreFailures') == 'true'
    outputs.upToDateWhen { false }
    testLogging { events 'failed'; exceptionFormat 'full' }
}

// OpenSearch's own engine tests (InternalEngineTests), derived to run on
// RustEngine by tools/derive_engine_tests.py. Needs Maven Central for the test
// framework, as the YAML runner does.
sourceSets {
    engineTest {
        java.srcDir 'src/engineTest/java'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    engineTestImplementation
}
dependencies {
    engineTestImplementation "org.opensearch.test:framework:${opensearchVersion}"
    engineTestImplementation fileTree(dir: opensearchLib, include: '*.jar')
}
tasks.named('compileEngineTestJava') {
    options.compilerArgs -= ['-Werror']
    options.compilerArgs += ['-Xlint:none', '-nowarn']
}
tasks.register('engineTest', Test) {
    description = "OpenSearch's InternalEngineTests, run on RustEngine."
    dependsOn cargoBuild
    testClassesDirs = sourceSets.engineTest.output.classesDirs
    classpath = sourceSets.engineTest.runtimeClasspath
    useJUnit()
    systemProperty 'lucene_rust.library.path', nativeLib.absolutePath
    systemProperty 'tests.security.manager', 'false'
    systemProperty 'java.io.tmpdir', layout.buildDirectory.dir('engine-test-tmp').get().asFile.absolutePath
    jvmArgs nativeAccess, '-ea', '-Xmx2g', '--add-opens=java.base/java.nio=ALL-UNNAMED'
    maxParallelForks = 1
    ignoreFailures = findProperty('engineTestIgnoreFailures') == 'true'
    outputs.upToDateWhen { false }
    testLogging { events 'failed'; exceptionFormat 'short' }
    doFirst { layout.buildDirectory.dir('engine-test-tmp').get().asFile.mkdirs() }
}

// Like the YAML runner, the engine tests refuse to run as root (BootstrapForTesting);
// scripts/opensearch-engine-tests.sh runs them as nobody from this staged classpath.
tasks.register('engineTestClasspath', Sync) {
    dependsOn writeJavaLauncher
    description = 'Stages the engine tests\' classpath under build/engine-test-classpath.'
    dependsOn tasks.named('engineTestClasses'), cargoBuild
    from(sourceSets.engineTest.runtimeClasspath)
    from(nativeLib)
    into layout.buildDirectory.dir('engine-test-classpath')
    // The distribution's jars and the framework's Maven ones are the same artifacts.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The YAML runner refuses to run as root (OpenSearch's Bootstrap check). For a
// root shell -- a container, typically -- this stages the runner's classpath
// where an unprivileged user can read it; scripts/verify-opensearch.sh runs it.
tasks.register('yamlRestTestClasspath', Sync) {
    dependsOn writeJavaLauncher
    description = 'Stages the YAML runner classpath under build/yaml-classpath.'
    dependsOn tasks.named('yamlRestTestClasses'), extractRestSpec
    from(sourceSets.yamlRestTest.runtimeClasspath)
    into layout.buildDirectory.dir('yaml-classpath')
}
