# The build compiles and runs on a JDK 25 toolchain (build.gradle) while
# Gradle itself may run on an older JDK. Locally Gradle finds installed JDKs on
# its own; in CI, actions/setup-java exports each one it installs as
# JAVA_HOME_<version>_<arch>, which Gradle reads only when named here.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64,JAVA_HOME_25_ARM64
