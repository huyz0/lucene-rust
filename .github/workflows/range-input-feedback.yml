name: range-input-feedback
on:
  push:
    branches: [codex/m02-03-read-at]
permissions:
  contents: read
concurrency:
  group: range-input-feedback-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compiler:
    name: partial range input compiler feedback (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Bounded compiler and component feedback
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/range-host-preflight.py "$RUNNER_TEMP"
          scratch="$RUNNER_TEMP/lucene-range-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$scratch.ext4"
          test ! -e "$scratch"
          test ! -e "$image"
          mkdir "$scratch"
          fallocate -l 21474836480 "$image"
          mkfs.ext4 -q -F -E nodiscard "$image"
          sudo mount -o loop,nodev,nosuid "$image" "$scratch"
          trap 'sudo umount "$scratch"' EXIT
          sudo chown "$(id -u):$(id -g)" "$scratch"
          python3 -B scripts/range-feedback.py "$scratch"
      - name: Retain a newly resolved lockfile for source pinning
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-feedback-${{ github.sha }}-lock
          path: ${{ runner.temp }}/range-feedback-${{ github.sha }}.lock
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain excluded benchmark graph for source pinning
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-feedback-${{ github.sha }}-benchmark-lock
          path: ${{ runner.temp }}/range-feedback-${{ github.sha }}-benchmark.lock
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain the finite native query physical trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-feedback-${{ github.sha }}-physical-trace
          path: ${{ runner.temp }}/range-feedback-${{ github.sha }}-trace.tsv
          if-no-files-found: ignore
          retention-days: 7

  qualify:
    needs: compiler
    name: bounded ${{ matrix.profile }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - {profile: provenance, arch: x64, runner: ubuntu-24.04}
          - {profile: checks, arch: x64, runner: ubuntu-24.04}
          - {profile: checks, arch: arm64, runner: ubuntu-24.04-arm}
          - {profile: tests, arch: x64, runner: ubuntu-24.04}
          - {profile: tests, arch: arm64, runner: ubuntu-24.04-arm}
          - {profile: release, arch: x64, runner: ubuntu-24.04}
          - {profile: release, arch: arm64, runner: ubuntu-24.04-arm}
          - {profile: coverage, arch: x64, runner: ubuntu-24.04}
    env:
      RANGE_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fixed qualification within the unchanged resource envelope
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/range-host-preflight.py "$RUNNER_TEMP"
          scratch="$RUNNER_TEMP/lucene-range-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$scratch.ext4"
          test ! -e "$scratch"
          test ! -e "$image"
          mkdir "$scratch"
          fallocate -l 21474836480 "$image"
          mkfs.ext4 -q -F -E nodiscard "$image"
          sudo mount -o loop,nodev,nosuid "$image" "$scratch"
          trap 'sudo umount "$scratch"' EXIT
          sudo chown "$(id -u):$(id -g)" "$scratch"
          python3 -B scripts/range-feedback.py "$scratch"
      - name: Retain native coverage export
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-qualification-${{ github.sha }}-${{ matrix.profile }}-${{ matrix.arch }}-coverage
          path: ${{ runner.temp }}/range-feedback-${{ github.sha }}-coverage.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain native production denominator and object inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-qualification-${{ github.sha }}-${{ matrix.profile }}-${{ matrix.arch }}-production
          path: ${{ runner.temp }}/range-feedback-${{ github.sha }}-production-coverage*.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain pinned Java and required inventory qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-qualification-${{ github.sha }}-${{ matrix.profile }}-${{ matrix.arch }}-provenance
          path: ${{ runner.temp }}/range-feedback-${{ github.sha }}-provenance.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain native query physical trace
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: range-qualification-${{ github.sha }}-${{ matrix.profile }}-${{ matrix.arch }}-trace
          path: ${{ runner.temp }}/range-feedback-${{ github.sha }}-trace.tsv
          if-no-files-found: ignore
          retention-days: 7
